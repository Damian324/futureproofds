semantic_models:
  - name: keysaas_daily_sl
    description: >
      Semantic layer for the Key SaaS daily snapshot table. Contains daily
      lifecycle and revenue metrics for both NTS and Paid Subscriptions
      across product lines.
    defaults:
      agg_time_dimension: interval_start
    model: ref('stg_fct_key_saas_byday')

    entities:
      - name: keysaas_daily_unique_key
        type: primary
        expr: unique_key

    dimensions:
      - name: interval_start
        type: time
        type_params:
          time_granularity: day
      - name: billing_account_id
        type: categorical
      - name: account_unique_key
        type: categorical
      - name: is_nts
        type: categorical
      - name: product
        type: categorical
      - name: plan_code
        type: categorical
      - name: plan_assistance_level
        type: categorical
      - name: plan_group
        type: categorical
      - name: billing_source
        type: categorical
      - name: country_name_asnow
        type: categorical
      - name: continent_asnow
        type: categorical
      - name: currency
        type: categorical

    measures:
      - name: daily_recurring_revenue_sum
        expr: recurring_revenue
        agg: sum
      - name: daily_new_revenue
        expr: "case when first_time_recurring = 1 then recurring_revenue else 0 end"
        agg: sum
      - name: daily_reactivated_revenue
        expr: "case when reactivated_recurring_customer = 1 then recurring_revenue else 0 end"
        agg: sum
      - name: daily_expanded_revenue
        expr: expanded_recurring_revenue
        agg: sum
      - name: daily_contracted_revenue # always negative
        expr: contracted_recurring_revenue
        agg: sum
      - name: daily_lost_recurring_revenue
        expr: "case when churned_recurring = 1 then lost_recurring_revenue else 0 end"
        agg: sum

metrics:
  - name: key_saas_daily_new_revenue_mt
    description: Recurring revenue from accounts becoming recurring for the first time in a given period.
    label: "Daily - New Revenue"
    type: simple
    type_params:
      measure: daily_new_revenue

  - name: key_saas_daily_reactivated_revenue_mt
    description: Recurring revenue from previously churned accounts that have reactivated.
    label: "Daily - Reactivated Revenue"
    type: simple
    type_params:
      measure: daily_reactivated_revenue

  - name: key_saas_daily_expanded_revenue_mt
    description: Revenue from existing recurring accounts that have expanded their plan.
    label: "Daily - Expanded Revenue"
    type: simple
    type_params:
      measure: daily_expanded_revenue

  - name: key_saas_daily_contracted_revenue_mt
    description: Revenue reduction from existing recurring accounts that have downgraded. Always a negative value.
    label: "Daily - Contracted Revenue"
    type: simple
    type_params:
      measure: daily_contracted_revenue

  - name: key_saas_daily_lost_recurring_revenue_mt
    description: Recurring revenue lost from churned accounts in the period.
    label: "Daily - Lost Recurring Revenue"
    type: simple
    type_params:
      measure: daily_lost_recurring_revenue
